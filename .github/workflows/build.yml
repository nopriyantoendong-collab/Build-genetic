name: Build Sync XxX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project ZIP (if exists)
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ℹ️ No ZIP file found"
            exit 0
          fi
          echo "📦 Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project/
          if [ -d "project/android" ]; then
            mv project/android/* . 2>/dev/null || true
            mv project/android/.[!.]* . 2>/dev/null || true
          elif [ -d "project/app" ]; then
            mv project/* . 2>/dev/null || true
          fi
          echo "📂 Final structure:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate App Icons
        run: python3 generate_icons.py
        continue-on-error: true

      - name: Detect Android Directory
        run: |
          if [ -f "android/gradlew" ]; then
            echo "ANDROID_DIR=android" >> $GITHUB_ENV
            echo "✅ Android dir: android/"
          elif [ -f "gradlew" ]; then
            echo "ANDROID_DIR=." >> $GITHUB_ENV
            echo "✅ Android dir: root"
          else
            echo "❌ ERROR: gradlew not found!"
            find . -name "gradlew" -maxdepth 3
            exit 1
          fi

      - name: Setup Gradle Wrapper
        run: |
          if [ "$ANDROID_DIR" = "android" ]; then
            curl -L -o android/gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
            chmod +x android/gradlew
          else
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
            chmod +x gradlew
          fi

      # ═══════════════════════════════════════════════
      # FIX #1: HAPUS package DARI MANIFEST + ADD NAMESPACE
      # ═══════════════════════════════════════════════
      - name: Fix AGP - Remove package, Add namespace
        run: |
          if [ "$ANDROID_DIR" = "android" ]; then
            MANIFEST="android/app/src/main/AndroidManifest.xml"
            GRADLE="android/app/build.gradle"
          else
            MANIFEST="app/src/main/AndroidManifest.xml"
            GRADLE="app/build.gradle"
          fi

          echo "═══════════════════════════════════════"
          echo "🔧 FIXING MANIFEST: $MANIFEST"
          echo "═══════════════════════════════════════"

          if [ -f "$MANIFEST" ]; then
            # Hapus package="..." dari Manifest
            sed -i 's/package="[^"]*"//g' "$MANIFEST"
            echo "✅ Removed package attribute from Manifest"

            # Hapus extractNativeLibs (deprecated di AGP baru)
            sed -i 's/android:extractNativeLibs="[^"]*"//g' "$MANIFEST"
            echo "✅ Removed extractNativeLibs attribute"
          fi

          echo ""
          echo "═══════════════════════════════════════"
          echo "🔧 FIXING BUILD.GRADLE: $GRADLE"
          echo "═══════════════════════════════════════"

          if [ -f "$GRADLE" ]; then
            # Cek apakah namespace sudah ada
            if ! grep -q "namespace" "$GRADLE"; then
              echo "➕ Adding namespace to $GRADLE"
              # Tambah namespace setelah 'android {'
              sed -i '0,/android\s*{/s//android {\n    namespace "com.sync.xxx"/' "$GRADLE"
              echo "✅ Namespace added"
            else
              echo "ℹ️ Namespace already exists"
            fi

            # Fix extractNativeLibs → useLegacyPackaging
            if grep -q "extractNativeLibs" "$GRADLE"; then
              sed -i 's/extractNativeLibs.*/useLegacyPackaging false/' "$GRADLE"
              echo "✅ Fixed extractNativeLibs in build.gradle"
            fi
          fi

          echo ""
          echo "═══════════════════════════════════════"
          echo "✅ AGP FIX COMPLETE"
          echo "═══════════════════════════════════════"
          echo ""
          echo "📄 Manifest header:"
          head -15 "$MANIFEST"
          echo ""
          echo "📄 Build.gradle header:"
          head -20 "$GRADLE"

      - name: Build Release APK
        run: |
          cd $ANDROID_DIR
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          if [ "$ANDROID_DIR" = "android" ]; then
            find android/app/build/outputs/apk/release/ -name "*.apk" | head -1 | xargs -I{} cp {} output/SyncXxX.apk
          else
            find app/build/outputs/apk/release/ -name "*.apk" | head -1 | xargs -I{} cp {} output/SyncXxX.apk
          fi
          ls -la output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPro-APK
          path: output/SyncXxX.apk
          retention-days: 30
