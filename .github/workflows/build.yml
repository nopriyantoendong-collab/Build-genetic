name: Build Sync XxX APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ═══════════════════════════════════════════════
      # STEP TAMBAHAN: EXTRACT ZIP KALAU ADA
      # ═══════════════════════════════════════════════
      - name: Extract Project ZIP (if exists)
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ℹ️ No ZIP file found, using existing project structure"
            exit 0
          fi
          echo "📦 Found ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project/
          echo "✅ Extracted to project/"
          ls -la project/

          # Detect folder android/ di dalam ZIP
          if [ -d "project/android" ]; then
            echo "📂 Moving project/android/* to root"
            mv project/android/* . 2>/dev/null || true
            mv project/android/.[!.]* . 2>/dev/null || true
          elif [ -d "project/app" ]; then
            echo "📂 Moving project/* to root"
            mv project/* . 2>/dev/null || true
          fi

          echo "📂 Final structure:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate App Icons
        run: python3 generate_icons.py
        continue-on-error: true

      # ═══════════════════════════════════════════════
      # STEP FIX: DETECT FOLDER GRADLEW
      # ═══════════════════════════════════════════════
      - name: Detect Android Directory
        run: |
          if [ -f "android/gradlew" ]; then
            echo "ANDROID_DIR=android" >> $GITHUB_ENV
            echo "✅ Android dir: android/"
          elif [ -f "gradlew" ]; then
            echo "ANDROID_DIR=." >> $GITHUB_ENV
            echo "✅ Android dir: root"
          else
            echo "❌ ERROR: gradlew not found!"
            find . -name "gradlew" -maxdepth 3
            exit 1
          fi

      - name: Setup Gradle Wrapper
        run: |
          if [ "$ANDROID_DIR" = "android" ]; then
            curl -L -o android/gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
            chmod +x android/gradlew
          else
            curl -L -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar"
            chmod +x gradlew
          fi

      - name: Build Release APK
        run: |
          cd $ANDROID_DIR
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          if [ "$ANDROID_DIR" = "android" ]; then
            find android/app/build/outputs/apk/release/ -name "*.apk" | head -1 | xargs -I{} cp {} output/SyncXxX.apk
          else
            find app/build/outputs/apk/release/ -name "*.apk" | head -1 | xargs -I{} cp {} output/SyncXxX.apk
          fi
          ls -la output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberPro-APK
          path: output/SyncXxX.apk
          retention-days: 30
